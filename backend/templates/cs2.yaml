id: cs2
name: Counter-Strike 2
description: CS2 dedicated server using SteamCMD
image: cm2network/cs2
env:
  STEAM_ACCOUNT_TOKEN: ""
  CS2_SERVERNAME: "LANForge CS2 Server"
  CS2_MAXPLAYERS: "16"
  CS2_PORT: "27015"
  CS2_TICKRATE: "128"
  CS2_MAP: "de_dust2"
  CS2_GAMETYPE: "0"
  CS2_GAMEMODE: "1"
ports:
  - host: 27015
    container: 27015
volumes:
  - name: cs2_data
    container: /home/steam/cs2-dedicated
restart: unless-stopped